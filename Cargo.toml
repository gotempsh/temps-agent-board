[package]
name = "temps-agent-board"
version = "0.1.0"
edition = "2021"

[dependencies]
temps-plugin-sdk = { path = "vendor/temps/crates/temps-plugin-sdk" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
